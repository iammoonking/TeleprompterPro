
name: Build PromptPro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -q PromptPro-Android-Source-Fresh.zip -d project

      - name: Fix Android source
        run: |
          python3 - <<'PY'
          p = "project/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              "compileSdk=35",
              """compileSdk=35
          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }"""
          )
          open(p, "w").write(s)

          p = "project/app/src/main/java/com/promptpro/app/MainActivity.kt"
          s = open(p).read()

          s = s.replace(
              'var recording by remember { mutableStateOf(false) }',
              'var recording by remember { mutableStateOf(false) }\n var activeRecording by remember { mutableStateOf<androidx.camera.video.Recording?>(null) }'
          )

          s = s.replace(
              'cam.startRecording(output,ContextCompat.getMainExecutor(ctx)){event->',
              'cam.startRecording(output,true,ContextCompat.getMainExecutor(ctx)){event: VideoRecordEvent ->'
          )

          s = s.replace(
              'else cam.stopRecording()',
              'else { activeRecording?.stop() }'
          )

          s = s.replace(
              'if(recording)cam.stopRecording();camera=false',
              'if(recording)activeRecording?.stop();camera=false'
          )

          s = s.replace(
              'try{activeRecording=',
              'try{activeRecording='
          )

          s = s.replace(
              'cam.startRecording(output,true,ContextCompat.getMainExecutor(ctx)){event: VideoRecordEvent ->',
              'activeRecording=cam.startRecording(output,true,ContextCompat.getMainExecutor(ctx)){event: VideoRecordEvent ->'
          )

          open(p, "w").write(s)

          assert "cam.stopRecording()" not in s
          assert "event: VideoRecordEvent ->" in s
          assert "activeRecording=cam.startRecording" in s
          PY

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptPro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
